name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Debug APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Web Application
        run: flutter build web --release --base-href "/FAVORITE-COLLECTION-SALE/"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Build Android Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Create Unique Release Tag
        id: release_tag
        run: |
          TAG_NAME="v1.0.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Favorite Collection Sale Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## Favorite Collection Sale Android APK

            This official release was compiled directly from the `main` branch with live Supabase backend integration.

            🌐 **Live Website:** https://darlinton4177-hub.github.io/FAVORITE-COLLECTION-SALE/

            ### Included in this build:
            - Live Supabase backend integration (products, categories, banners, coupons, exchange rates).
            - Official Favorite Collection brand logo and launcher icons.
            - Authentic NGN (₦) currency formatting across catalogue, cart, and checkout.
            - User authentication and live profile management via Supabase Auth.
            - Secure store administration console.
            - AI Shopping Assistant (English, Pidgin, Igbo, Yoruba).

            **Download the attached APK below to install on your Android device.**
          files: build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
