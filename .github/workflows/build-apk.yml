name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Release APK & Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Web Application
        run: flutter build web --release --base-href "/FAVORITE-COLLECTION-SALE/"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Unique Release Tag
        id: release_tag
        run: |
          TAG_NAME="v1.0.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Favorite Collection Sale Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## Favorite Collection Sale Release Build

            Compiled directly from `main` branch with live Supabase backend, tolerantly parsed catalog, and real data synchronization.

            🌐 **Live Website:** https://darlinton4177-hub.github.io/FAVORITE-COLLECTION-SALE/

            ### Key Enhancements in this Build:
            - **Android Internet Permission:** Added `<uses-permission android:name="android.permission.INTERNET"/>` ensuring live Supabase connectivity on all Android devices.
            - **Live Supabase Mutations:** Order placements, product/category/banner modifications now persist directly to Supabase with proper RLS constraints.
            - **Visible Connectivity & Diagnostics:** Real-time data source status (LIVE/CACHED/ERROR), rows fetched counters, and connection diagnostics in Profile.
            - **Robust Parsing:** Tolerant field and record parsers that gracefully handle schema evolution.
            - **Admin Security:** Role-based authentication backed by Supabase `profiles.role = 'admin'` replacing legacy PIN entry.

            **Download the attached APK below to install on your Android device.**
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
